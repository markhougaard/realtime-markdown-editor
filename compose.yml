# Deployed by the server's deploy runner: docker compose -p markdown, with
# DEPLOY_TAG set to the commit's 12-character sha. Built on the server (arm64).
services:
  app:
    build: .
    image: markdown-app:${DEPLOY_TAG:?set by the deploy runner}
    container_name: markdown-app
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/documents.db
    volumes:
      - markdown_data:/app/data   # project "markdown" → volume markdown_markdown_data (live documents)
    networks:
      - web
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {if (![200, 307].includes(r.statusCode)) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  markdown_data:
    driver: local

networks:
  web:
    external: true
